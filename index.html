<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(25deg, rgb(1, 196, 196), rgb(1, 51, 158));
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -60%);
            background: rgba(255,255,255,0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 2px rgba(0,0,0,0.2);
            width: 500px;
            max-width: 100%;
            text-align: center;
        }
      
        h1, h2 {
            margin-bottom: 20px;
            color: rgb(0, 95, 95);
        }
        h2 {
            font-size: 1.2rem;
            margin: 2rem;
            font-weight: 300;
            color: rgb(45, 143, 143);
        }
        .quiz, .result, .leaderboard {
            display: none;
        }
        .active {
            display: block;
        }
        .option {
            padding: 10px;
            margin: 10px 0;
            background: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid #0056b3;
            color: #013369;
        }
       
        .option.correct {
            background: springgreen;
            border: 2px solid green;
        }
        .option.incorrect {
            color: rgb(253, 234, 211);
            background: rgb(221, 36, 94);
            border: 2px solid rgb(121, 0, 0);
            text-decoration: line-through;
            opacity: 0.8;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background: #35abb9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #46219c;
        }
        ul {
            list-style: none;
            margin-top: 20px;
        }
        li {
            background: #f8f9fa;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
    </style>
    <title>Quiz with High Scores</title>
</head>
<body>
    <div class="container">
        <div class="home active">
            <h1>Quiz Game</h1>
            <button id="start-btn">Start Quiz</button>
            <button id="leaderboard-btn">View Leaderboard</button>
        </div>
        <div class="quiz">
            <h2 id="question"></h2>
            <div id="options"></div>
            <button id="next-btn" disabled>Next</button>
        </div>
        <div class="result">
            <h2>Quiz Complete!</h2>
            <p>Your Score: <span id="score"></span></p>
            <input type="text" id="username" placeholder="Enter your name" aria-label="Your name">
            <button id="save-score">Save Score</button>
            <button id="home-btn">Back to Home</button>
        </div>
        <div class="leaderboard">
            <h2>High Scores</h2>
            <ul id="scores-list"></ul>
            <button id="clear-scores">Clear Scores</button>
            <button id="back-btn">Back to Home</button>
        </div>
    </div>
