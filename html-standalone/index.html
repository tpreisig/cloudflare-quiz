<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Quiz with High Scores</title>
</head>
<body>
    <div class="container">
        <div class="home active">
            <h1>Quiz Game</h1>
            <button id="start-btn">Start Quiz</button>
            <button id="leaderboard-btn">View Leaderboard</button>
        </div>
        <div class="quiz">
            <h2 id="question"></h2>
            <div id="options"></div>
            <button id="next-btn" disabled>Next</button>
        </div>
        <div class="result">
            <h2>Quiz Complete!</h2>
            <p>Your Score: <span id="score"></span></p>
            <input type="text" id="username" placeholder="Enter your name" aria-label="Your name">
            <button id="save-score">Save Score</button>
            <button id="home-btn">Back to Home</button>
        </div>
        <div class="leaderboard">
            <h2>High Scores</h2>
            <ul id="scores-list"></ul>
            <button id="clear-scores">Clear Scores</button>
            <button id="back-btn">Back to Home</button>
        </div>
    </div>
